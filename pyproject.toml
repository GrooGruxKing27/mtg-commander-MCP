[project]
name = "mtg-commander-mcp"
version = "0.7.1"
description = "MCP server for Magic: The Gathering Commander/EDH - EDHRec, Scryfall, Archidekt, Moxfield, MTG Rules, and Delver Lens collection support"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "cloudscraper>=1.2.71",
]

[project.scripts]
mtg-commander-mcp = "mtg_commander_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_commander_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
]

# `uv run --no-editable` (how Claude Desktop launches this) reuses a cached
# wheel unless a cache key changed; by default only pyproject.toml counts, so
# source edits were silently ignored. Track the sources too.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

